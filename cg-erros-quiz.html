<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Vanessa: Contabilidade Geral, meus erros</title>
<style>
  :root{--navy:#1E2B38; --q:#b45309; --q-cl:#fef3e2; --laranja:#FFE4CC; --coral:#E25E42; --ok:#2e7d4f; --ok-cl:#d7f0df; --no:#c0392b; --no-cl:#fbe0dc; --cinza:#64748b;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif; background:linear-gradient(160deg,#fef3e2,#fbdcb0); color:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:70px 20px 20px; line-height:1.55;}
  .app{width:100%; max-width:640px; background:#fff; border-radius:24px; box-shadow:0 12px 40px rgba(180,83,9,.16); overflow:hidden;}
  header{background:linear-gradient(135deg,#b45309,#7c2d12); color:#fff; padding:22px 26px 18px;}
  header .selo{font-size:.72rem; letter-spacing:1.5px; text-transform:uppercase; opacity:.8; font-weight:700;}
  header h1{font-size:1.35rem; margin-top:4px;}
  .barra-topo{display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:.9rem; font-weight:700;}
  .progresso{height:9px; background:rgba(255,255,255,.25); border-radius:20px; margin-top:10px; overflow:hidden;}
  .progresso span{display:block; height:100%; width:0; background:var(--coral); border-radius:20px; transition:width .35s ease;}
  main{padding:26px 26px 30px;}
  .pergunta{font-size:1.2rem; font-weight:800; color:var(--navy); margin-bottom:20px; min-height:60px;}
  .alternativas{display:flex; flex-direction:column; gap:12px;}
  .alt{text-align:left; font-size:1.02rem; padding:15px 18px; border:2px solid #fbdcb0; background:#fffaf2; border-radius:14px; cursor:pointer; transition:all .15s ease; display:flex; align-items:center; gap:12px; font-family:inherit; color:var(--navy);}
  .alt:hover:not(:disabled){border-color:var(--q); background:var(--q-cl); transform:translateY(-1px);}
  .alt:disabled{cursor:default;}
  .alt .letra{flex:0 0 30px; height:30px; border-radius:50%; background:var(--q); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.95rem;}
  .alt.certo{border-color:var(--ok); background:var(--ok-cl);} .alt.certo .letra{background:var(--ok);}
  .alt.errado{border-color:var(--no); background:var(--no-cl);} .alt.errado .letra{background:var(--no);}
  .feedback{margin-top:20px; padding:15px 18px; border-radius:14px; display:none; font-size:1rem;}
  .feedback.mostrar{display:block;}
  .feedback.ok{background:var(--ok-cl);}
  .feedback.no{background:var(--no-cl);}
  .feedback b:first-child{display:block; margin-bottom:3px;}
  .proxima{margin-top:20px; width:100%; padding:15px; font-size:1.1rem; font-weight:800; background:var(--coral); color:#fff; border:none; border-radius:14px; cursor:pointer; font-family:inherit; display:none;}
  .proxima.mostrar{display:block;} .proxima:hover{filter:brightness(1.08);}
  .final{text-align:center; padding:14px 6px;}
  .final .emoji{font-size:3.4rem;} .final h2{font-size:1.6rem; margin:10px 0;}
  .final .placar{font-size:1.15rem; color:var(--cinza); margin-bottom:6px;}
  .final .nota{font-size:3rem; font-weight:900; color:var(--q); margin:6px 0;}
  .final .recado{background:var(--laranja); border-radius:14px; padding:14px 18px; margin:18px 0; color:var(--navy);}
  .refazer{padding:14px 28px; font-size:1.05rem; font-weight:800; background:var(--q); color:#fff; border:none; border-radius:14px; cursor:pointer; font-family:inherit;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="app">
  <header>
    <div class="selo">Contabilidade Geral · Meus erros · Quiz</div>
    <h1>Equivalência patrimonial, CPC 26 e CPC 00 📒</h1>
    <div class="barra-topo"><span id="contador">Questão 1</span><span id="placar">Acertos: 0</span></div>
    <div class="progresso"><span id="barra"></span></div>
  </header>
  <main id="palco">
    <div class="pergunta" id="pergunta"></div>
    <div class="alternativas" id="alternativas"></div>
    <div class="feedback" id="feedback"></div>
    <button class="proxima" id="proxima">Próxima ➜</button>
  </main>
</div>
<script>
const questoes = [
// bem fáceis
  { q:"No MEP, os dividendos recebidos da investida...", alt:["reduzem o investimento","são receita na DRE","aumentam o investimento"], c:0,
    e:"O lucro já entrou pela equivalência. Contar o dividendo de novo duplicaria." },
  { q:"A equivalência patrimonial sobre o lucro da investida vai para...", alt:["a DRE","o PL, como ORA","o passivo"], c:0,
    e:"E aumenta o valor do investimento." },
  { q:"O ajuste acumulado de conversão da investida no exterior vai para...", alt:["o PL (outro resultado abrangente)","a DRE","o passivo"], c:0,
    e:"Só vai para a DRE se a investidora vender ou perder a influência." },
  { q:"Pagar menos que o valor justo da parte adquirida gera...", alt:["ganho por compra vantajosa no resultado","goodwill","deságio no PL"], c:0,
    e:"O ganho vai para o resultado na data da compra." },
  { q:"O goodwill é calculado sobre...", alt:["o valor justo da parte adquirida","o valor contábil da parte adquirida","o capital social da investida"], c:0,
    e:"Goodwill = pago − valor justo. A diferença contábil × justo é mais-valia." },
  { q:"Resultado abrangente é...", alt:["resultado do período mais os ORA","só os outros resultados abrangentes","o lucro líquido"], c:0,
    e:"DRE mais DRA." },
  { q:"As receitas e despesas da DRE são resultados abrangentes?", alt:["Sim, todas","Não, nenhuma","Só as financeiras"], c:0,
    e:"O resultado abrangente engloba o resultado do período." },
  { q:"Custo primário (MP + MOD) é...", alt:["parte dos custos diretos","igual aos custos diretos","o mesmo que custo de transformação"], c:0,
    e:"Há diretos que não são primários, como embalagens." },
  { q:"O custo fixo...", alt:["depende da capacidade instalada","independe da capacidade instalada","varia com cada unidade produzida"], c:0,
    e:"É fixo quanto ao volume, dentro de uma capacidade." },
  { q:"Recebimento adiantado de cliente:", alt:["D Caixa / C Adiantamento de Clientes","D Caixa / C Receita de Vendas","D Clientes / C Caixa"], c:0,
    e:"Adiantamento de clientes é passivo até a entrega." },

  // MEP e combinação
  { q:"Coligada: investimento 200.000, 25% de participação, lucro 175.000, dividendos 50.000. Saldo final?", alt:["231.250","243.750","200.000"], c:0,
    e:"200.000 + 43.750 − 12.500 = 231.250. Não esqueça de baixar os dividendos." },
  { q:"Pagou 30 mi por 80% de uma empresa com valor justo de 45 mi. Na aquisição há...", alt:["ganho por compra vantajosa de 6 mi","goodwill de 6 mi","nada no resultado"], c:0,
    e:"80% × 45 = 36 mi de valor justo. Pagou 30: ganho de 6 mi." },
  { q:"Pagou 6,2 mi por 80%. PL contábil 5 mi, valor justo 7 mi. O goodwill é...", alt:["0,6 mi","2,2 mi","1,6 mi"], c:0,
    e:"6,2 − 80% × 7 = 0,6. Os 1,6 mi são mais-valia." },
  { q:"Pagou 80 mi por 80% (valor justo 120 mi); lucro no ano 8 mi. Resultado da investidora?", alt:["22,4 mi","6,4 mi","16 mi"], c:0,
    e:"Compra vantajosa 16 mi + equivalência 6,4 mi = 22,4 mi." },
  { q:"40% de participação, lucro da investida 20 mi, dividendos 4 mi. Efeito na DRE da investidora?", alt:["8 mi","6,4 mi","1,6 mi"], c:0,
    e:"Só a equivalência entra na DRE. Dividendo não." },
  { q:"Ao perder a influência significativa, a investidora...", alt:["baixa todo o investimento e mede o que sobrou a valor justo","baixa só a parte vendida","mantém o MEP no que sobrou"], c:0,
    e:"E reclassifica o ORA de conversão para a DRE (CPC 18)." },
  { q:"No balanço consolidado, o goodwill aparece...", alt:["separado, no Intangível","dentro de Investimentos","no PL"], c:0,
    e:"No individual, fica dentro de Investimentos." },

  // CPC 26
  { q:"Na DMPL, o resultado abrangente deve ser apresentado...", alt:["separando controladores e não controladores","sem segregação","só nas notas"], c:0,
    e:"CPC 26, item 106. A segregação é obrigatória." },
  { q:"A segregação do resultado entre controladores e não controladores é...", alt:["obrigatória","alternativa","vedada"], c:0,
    e:"Acertei isso numa questão e neguei na DMPL no mesmo dia." },
  { q:"O conjunto completo do CPC 26 inclui...", alt:["BP, DRE, DRA, DMPL e DFC","BP, DRA, DFC, DMPL e DLPA","BP, DRE, DLPA e DFC"], c:0,
    e:"Mais notas explicativas. A DLPA é da Lei 6.404." },
  { q:"O CPC 26 difere da Lei 6.404 por incluir a...", alt:["DMPL","DLPA","DVA"], c:0,
    e:"Na Lei 6.404 a DMPL é facultativa; no CPC 26 é obrigatória." },
  { q:"Com histórico de lucros e pronto acesso a recursos, a continuidade...", alt:["pode ser concluída sem análise pormenorizada","exige análise detalhada","não precisa ser avaliada"], c:0,
    e:"Texto literal do CPC 26, item 26. Não é pegadinha." },
  { q:"A análise por item dos ORA de cada componente do PL...", alt:["é obrigatória, na DMPL ou nas notas","é facultativa","só pode ir na DRA"], c:0,
    e:"O opcional é o lugar, não a divulgação." },

  // CPC 00
  { q:"O valor em uso considera...", alt:["o uso e a alienação final do ativo","só o uso, sem a alienação final","o preço de reposição"], c:0,
    e:"A FCC suprimiu “e de sua alienação final”." },
  { q:"É base de mensuração de passivo no CPC 00:", alt:["valor de cumprimento","valor em uso","custo corrente"], c:0,
    e:"Valor em uso é de ativo." },
  { q:"Materialidade é...", alt:["aspecto da relevância","característica de melhoria","característica independente"], c:0,
    e:"CPC 00, item 2.11." },
  { q:"São características qualitativas fundamentais:", alt:["relevância e representação fidedigna","comparabilidade e verificabilidade","tempestividade e compreensibilidade"], c:0,
    e:"As outras quatro são de melhoria." },

  // estoques
  { q:"Estoque comprado a prazo longo, com juros embutidos, entra por...", alt:["valor presente","valor nominal total","valor nominal mais os juros"], c:0,
    e:"Os juros vão para o resultado ao longo do prazo." },
  { q:"Estoque: custo 250.000, VRL caiu para 220.000 e depois subiu para 260.000. Saldo final?", alt:["250.000","260.000","220.000"], c:0,
    e:"A reversão vai só até o custo original." },
  { q:"Tributos recuperáveis na compra de estoque...", alt:["não entram no custo","entram no custo","viram despesa"], c:0,
    e:"Viram ativo a recuperar." }
];
function embaralhar(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function preparar(){ const faceis=questoes.slice(0,10), resto=questoes.slice(10); return embaralhar(faceis.slice()).concat(embaralhar(resto.slice())).map(q=>{ const alts=q.alt.map((t,i)=>({t,c:i===q.c})); embaralhar(alts); return {q:q.q, alt:alts.map(a=>a.t), c:alts.findIndex(a=>a.c), e:q.e}; }); }
let jogo = preparar(); let atual=0, acertos=0; const letras=["A","B","C"]; const $=id=>document.getElementById(id);
function render(){ const it=jogo[atual]; $("contador").textContent=`Questão ${atual+1} de ${jogo.length}`; $("placar").textContent=`Acertos: ${acertos}`; $("barra").style.width=`${(atual/jogo.length)*100}%`; $("pergunta").textContent=it.q; const b=$("alternativas"); b.innerHTML=""; it.alt.forEach((t,i)=>{ const x=document.createElement("button"); x.className="alt"; x.innerHTML=`<span class="letra">${letras[i]}</span><span>${t}</span>`; x.onclick=()=>responder(i); b.appendChild(x); }); const f=$("feedback"); f.className="feedback"; f.innerHTML=""; $("proxima").className="proxima"; $("proxima").textContent=atual===jogo.length-1?"Ver resultado 🏁":"Próxima ➜"; }
function responder(e){ const it=jogo[atual]; document.querySelectorAll(".alt").forEach((b,i)=>{ b.disabled=true; if(i===it.c)b.classList.add("certo"); if(i===e&&e!==it.c)b.classList.add("errado"); }); const f=$("feedback"); if(e===it.c){acertos++; f.className="feedback ok mostrar"; f.innerHTML=`<b>✅ Acertou!</b>${it.e}`;} else {f.className="feedback no mostrar"; f.innerHTML=`<b>❌ Quase!</b> A resposta certa é <b>${letras[it.c]}</b>. ${it.e}`;} $("placar").textContent=`Acertos: ${acertos}`; $("proxima").classList.add("mostrar"); }
$("proxima").onclick=()=>{ atual++; if(atual<jogo.length)render(); else final(); };
function final(){ const t=jogo.length; const nota=Math.round((acertos/t)*100)/10; const p=acertos/t; let e,m; if(p>=0.9){e="🏆";m="Excelente! Esse bloco está firme. Refaça daqui a 7 dias para não esquecer.";} else if(p>=0.7){e="😃";m="Muito bom! Revise os cartões dos que errou e refaça amanhã.";} else if(p>=0.45){e="🙂";m="Bom começo. Leia os cartões e refaça amanhã.";} else {e="💪";m="Sem problema. Leia os cartões com calma e tente de novo.";} $("barra").style.width="100%"; $("contador").textContent="Fim do quiz"; $("palco").innerHTML=`<div class="final"><div class="emoji">${e}</div><h2>Quiz concluído!</h2><div class="placar">Você acertou <b>${acertos}</b> de <b>${t}</b></div><div class="nota">Nota ${nota}</div><div class="recado">${m}</div><button class="refazer" onclick="reiniciar()">🔀 Embaralhar e refazer</button></div>`; }
function reiniciar(){ atual=0; acertos=0; jogo=preparar(); $("palco").innerHTML=`<div class="pergunta" id="pergunta"></div><div class="alternativas" id="alternativas"></div><div class="feedback" id="feedback"></div><button class="proxima" id="proxima">Próxima ➜</button>`; $("proxima").onclick=()=>{ atual++; if(atual<jogo.length)render(); else final(); }; render(); }
render();
</script>
</body>
</html>
