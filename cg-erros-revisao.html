<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão da Vanessa: Contabilidade Geral, meus erros</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(160deg,#fef3e2,#fbdcb0); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:70px 16px 24px; color:#1E2B38;}
  .box{width:100%; max-width:560px; text-align:center;}
  h1{font-size:1.3rem; color:#b45309; margin-bottom:4px;}
  .sub{color:#64748b; font-size:.9rem; margin-bottom:16px;}
  .contador{font-weight:700; color:#64748b; margin-bottom:10px;}
  .tema{display:inline-block; font-size:.78rem; font-weight:700; color:#b45309; background:#fff; border:1px solid #b45309; border-radius:999px; padding:2px 10px; margin-bottom:10px;}
  .tema.facil{color:#fff; background:#2e7d4f; border-color:#2e7d4f;}
  .cartao{background:#fff; border-radius:22px; box-shadow:0 12px 34px rgba(30,43,56,.16); padding:30px 24px; min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;}
  .rotulo{font-size:.75rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:800;}
  .rotulo.p{color:#E25E42;} .rotulo.r{color:#b45309;}
  .pergunta{font-size:1.25rem; font-weight:800; line-height:1.4;}
  .resposta{font-size:1.08rem; line-height:1.55; color:#1E2B38; border-top:2px dashed #e2e8f0; padding-top:14px; width:100%;}
  .fonte{display:block; margin-top:8px; font-size:.82rem; color:#64748b;}
  .bts{display:flex; gap:10px; margin-top:16px; justify-content:center; flex-wrap:wrap;}
  button{font-family:inherit; font-size:1rem; font-weight:800; border:none; cursor:pointer; padding:13px 20px; border-radius:14px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .prox{background:#E25E42; color:#fff;} .ant{background:#e2e8f0; color:#1E2B38;} .emb{background:#fff; color:#1E2B38; border:2px solid #cbd5e1;}
</style>
</head>
<body>
<a href="index.html" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">&larr; Voltar</a>
<div class="box">
  <h1>Contabilidade Geral: meus erros em cartões</h1>
  <div class="sub">Tudo aqui eu já errei em questão FCC. Leia a pergunta, responda de cabeça, confira logo abaixo.</div>
  <div class="contador" id="contador"></div>
  <div class="tema" id="tema"></div>
  <div class="cartao">
    <div><div class="rotulo p">Pergunta</div><div class="pergunta" id="pergunta"></div></div>
    <div class="resposta" id="resposta"></div>
  </div>
  <div class="bts">
    <button class="ant" id="ant">&larr; Anterior</button>
    <button class="prox" id="prox">Próximo &rarr;</button>
  </div>
  <div class="bts"><button class="emb" id="emb">Embaralhar e recomeçar</button></div>
</div>
<script>
const cartoes = [
["Bem fácil","No MEP, os dividendos recebidos vão para onde?","Reduzem o investimento.<br>Não entram na DRE: o lucro já foi reconhecido pela equivalência.","Errei nos dois sentidos, em 03/09 e 05/09"],
["Bem fácil","A equivalência patrimonial sobre o lucro vai para onde?","Para a DRE, e aumenta o investimento.","CPC 18"],
["Bem fácil","O ajuste de conversão da investida no exterior vai para onde?","Para o PL, como outro resultado abrangente.<br>Não passa pela DRE.","CPC 02 e CPC 18"],
["Bem fácil","O que é compra vantajosa?","Pagar menos que o valor justo da parte adquirida.<br>A diferença é ganho no resultado, na data da compra.","CPC 15. Esqueci 3 vezes"],
["Bem fácil","Como se calcula o goodwill?","Valor pago menos o valor justo da parte adquirida.<br>Não é sobre o valor contábil.","CPC 15"],
["Bem fácil","Resultado abrangente é o quê?","Resultado do período (DRE) mais os outros resultados abrangentes (DRA).","CPC 26"],
["Bem fácil","Toda receita e despesa da DRE é resultado abrangente?","Sim. O resultado abrangente engloba a DRE.","CPC 26. Errei achando que não"],
["Bem fácil","Custo primário é igual a custo direto?","Não. Primário (MP + MOD) está contido nos diretos.<br>Embalagem e energia medida por produto também são diretos.","Contabilidade de custos"],
["MEP","Roteiro fixo antes de calcular investimento por MEP?","1. Pago × valor justo (compra vantajosa?).<br>2. Equivalência sobre o lucro → DRE.<br>3. Dividendos → reduzem o investimento.<br>4. Ajuste de conversão → PL.","Meus erros de investimentos"],
["MEP","Na compra vantajosa, por quanto o investimento entra?","Pelo valor justo da parte adquirida, não pelo valor pago.","CPC 15"],
["MEP","A diferença entre valor justo e valor contábil da parte adquirida é o quê?","Mais-valia de ativos líquidos.<br>O goodwill é só o que passa do valor justo.","CPC 15 e CPC 18"],
["MEP","O que acontece quando a investidora perde a influência significativa?","Baixa 100% do investimento.<br>O que sobrou vai a valor justo.<br>O ORA de conversão é reclassificado para a DRE.","CPC 18"],
["MEP","Onde fica o goodwill no balanço individual e no consolidado?","Individual: dentro de Investimentos.<br>Consolidado: separado no Intangível.","CPC 18 e CPC 15"],
["CPC 26","O que a DMPL deve trazer sobre o resultado abrangente?","O resultado abrangente total, separando a parte dos controladores e a dos não controladores.","CPC 26, item 106"],
["CPC 26","Segregar controladores e não controladores é opcional?","Não. É sempre obrigatório: no resultado e na DMPL.","CPC 26, itens 81B e 106. Acertei e errei a mesma regra no mesmo dia"],
["CPC 26","Qual o conjunto completo de demonstrações do CPC 26?","BP, DRE, DRA, DMPL, DFC e notas explicativas.<br>Sem DLPA.","CPC 26, item 10"],
["CPC 26","DLPA x DMPL: o que é obrigatório na Lei 6.404 e no CPC 26?","Lei 6.404: DLPA obrigatória, DMPL facultativa.<br>CPC 26: DMPL obrigatória, DLPA nem aparece.","CPC 26 e Lei 6.404"],
["CPC 26","Continuidade: quando dispensa análise pormenorizada?","Quando há histórico de operações lucrativas e pronto acesso a recursos financeiros.","CPC 26, item 26 (texto literal)"],
["CPC 26","Análise por item dos ORA na DMPL: é facultativa?","A divulgação é obrigatória.<br>O que é opcional é o lugar: DMPL ou notas.","CPC 26, item 106A"],
["CPC 00","Valor em uso considera a alienação final do ativo?","Sim. Uso mais alienação final.","CPC 00. A FCC tirou esse pedaço da definição"],
["CPC 00","Materialidade é o quê na estrutura conceitual?","Aspecto da relevância, específico da entidade.","CPC 00, item 2.11"],
["CPC 00","Quais as características fundamentais?","Relevância e representação fidedigna.<br>O resto é de melhoria.","CPC 00"],
["Estoques","Compra de estoque a prazo longo entra por quanto?","A valor presente, sem tributos recuperáveis, mais frete.<br>O fornecedor acumula juros até a data do balanço.","CPC 16 e CPC 12"],
["Estoques","Estoque a custo ou VRL: e se o VRL subir depois?","Reverte a perda, mas só até o custo original.","CPC 16"],
["Lançamentos","Recebimento adiantado de cliente: qual o lançamento?","D Caixa / C Adiantamento de Clientes (passivo).","Contabilidade geral"],
["Custos","O custo fixo depende da capacidade instalada?","Sim. É fixo quanto ao volume produzido, mas sobe se a capacidade aumentar.","Contabilidade de custos"]
];
let ordem = cartoes.map((_,i)=>i), pos = 0;
const $ = id => document.getElementById(id);
function mostra(){
  const c = cartoes[ordem[pos]];
  $("contador").textContent = `Cartão ${pos+1} de ${cartoes.length}`;
  $("tema").textContent = c[0];
  $("tema").className = "tema" + (c[0]==="Bem fácil" ? " facil" : "");
  $("pergunta").innerHTML = c[1];
  $("resposta").innerHTML = `<div class="rotulo r">Resposta</div>${c[2]}<span class="fonte">${c[3]}</span>`;
}
$("prox").onclick = () => { pos = (pos+1) % cartoes.length; mostra(); };
$("ant").onclick = () => { pos = (pos-1+cartoes.length) % cartoes.length; mostra(); };
$("emb").onclick = () => { for(let i=ordem.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [ordem[i],ordem[j]]=[ordem[j],ordem[i]];} pos=0; mostra(); };
document.addEventListener("keydown", e => { if(e.key==="ArrowRight") $("prox").click(); else if(e.key==="ArrowLeft") $("ant").click(); });
mostra();
</script>
</body>
</html>
