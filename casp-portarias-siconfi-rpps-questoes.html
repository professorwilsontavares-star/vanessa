<script>
const QUESTOES = [
{t:"Portaria 163/2001", e:"Segundo a Portaria Interministerial STN/SOF nº 163/2001, a respeito da classificação da despesa por natureza, considere:<br>I. A modalidade de aplicação tem por finalidade identificar os objetos de gasto, tais como vencimentos, juros, diárias e material de consumo.<br>II. A modalidade de aplicação objetiva, precipuamente, possibilitar a eliminação da dupla contagem dos recursos transferidos ou descentralizados.<br>III. Entende-se por grupo de natureza de despesa a agregação de elementos de despesa que apresentam as mesmas características quanto ao objeto de gasto.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:3, d:"Portaria 163/2001, art. 3º, §§ 1º a 3º", k:"possibilitar a eliminação da dupla contagem",
 x:"I: errada, porque identificar os objetos de gasto é a finalidade do elemento de despesa (art. 3º, § 3º), e não da modalidade. II: correta (art. 3º, § 1º: a modalidade é informação gerencial que busca eliminar a dupla contagem). III: correta, literal do art. 3º, § 2º. Gabarito: II e III."},

{t:"Portaria 163/2001", e:"Nos termos da Portaria Interministerial STN/SOF nº 163/2001, considere:<br>I. Na lei orçamentária, a discriminação da despesa, quanto à sua natureza, far-se-á, no mínimo, por categoria econômica, grupo de natureza de despesa e elemento de despesa.<br>II. A alocação dos créditos orçamentários na lei orçamentária anual deverá ser feita diretamente à unidade orçamentária responsável pela execução das ações correspondentes.<br>III. É facultada a consignação de recursos a título de transferência para unidades integrantes dos orçamentos fiscal e da seguridade social.<br>Está correto o que se afirma em",
 a:["II, apenas.","III, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas."],
 c:0, d:"Portaria 163/2001, arts. 6º e 7º", k:"A LOA vai, no mínimo, até a",
 x:"I: errada, porque o art. 6º exige, no mínimo, categoria econômica, grupo de natureza de despesa e modalidade de aplicação; o elemento aparece na execução. II: correta (art. 7º). III: errada, porque o art. 7º veda a consignação de recursos a título de transferência para unidades dos orçamentos fiscal e da seguridade social. Gabarito: II."},

{t:"Portaria 163/2001", e:"No orçamento de um Estado, foi empenhada despesa com a classificação por natureza 3.3.91.97. De acordo com a Portaria Interministerial STN/SOF nº 163/2001, considere:<br>I. O segundo dígito identifica o grupo de natureza de despesa Pessoal e Encargos Sociais.<br>II. A modalidade de aplicação 91 corresponde a Transferências a Municípios.<br>III. O elemento 97 corresponde a Aporte para Cobertura do Déficit Atuarial do RPPS, conforme plano de amortização estabelecido em lei do ente, exceto as despesas decorrentes de alíquota de contribuição suplementar.<br>Está correto o que se afirma em",
 a:["III, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:0, d:"Portaria 163/2001, Anexo II (grupo 3, modalidades 40 e 91, elemento 97)", k:"Aporte para Cobertura do Déficit Atuarial do RPPS",
 x:"I: errada, porque o grupo 3 é Outras Despesas Correntes; Pessoal e Encargos Sociais é o grupo 1. II: errada, porque 91 é Aplicação Direta Decorrente de Operação entre Órgãos, Fundos e Entidades Integrantes dos Orçamentos Fiscal e da Seguridade Social (intraorçamentária); Transferências a Municípios é a 40. III: correta (Anexo II, elemento 97). Gabarito: III."},

{t:"Portaria 163/2001", e:"Sobre o código de natureza da receita orçamentária previsto na Portaria Interministerial STN/SOF nº 163/2001, considere:<br>I. A natureza de receita intraorçamentária deve ser constituída substituindo-se o dígito referente às categorias econômicas 1 ou 2 pelos dígitos 7, se corrente, ou 8, se de capital, mantendo-se o restante da codificação.<br>II. Na apropriação da receita é facultada a utilização do dígito \"0\" no tipo de receita, quando não houver multas ou juros.<br>III. Os recursos originados de multas e juros de mora de receitas de capital são registrados como receita corrente, com \"1\" na categoria econômica, \"9\" na origem e \"4\" na espécie.<br>Está correto o que se afirma em",
 a:["I, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:2, d:"Portaria 163/2001, art. 2º, §§ 7º, 13 e 14", k:"Multas e juros sobre receitas de capital",
 x:"I: correta (art. 2º, § 13). II: errada, porque o § 14 veda o uso do dígito \"0\" na apropriação da receita; ele identifica natureza não valorizável ou agregadora. III: correta (art. 2º, § 7º: código 1.9.4, combinado com os tipos 2, 4, 5, 6, 7 e 8). Gabarito: I e III."},

{t:"Portaria 163/2001", e:"Em relação à Reserva de Contingência e à Reserva do RPPS, segundo a Portaria Interministerial STN/SOF nº 163/2001, considere:<br>I. As duas Reservas são identificadas, quanto à natureza da despesa, pelo código \"9.9.99.99.99\".<br>II. A Reserva do RPPS é identificada, nas classificações por função e subfunção e na estrutura programática, pelo código \"99.997.9999.xxxx.xxxx\".<br>III. A modalidade de aplicação 99 (A Definir) pode ser utilizada para a classificação orçamentária dessas Reservas, vedada a execução orçamentária enquanto não houver sua definição.<br>Está correto o que se afirma em",
 a:["I, apenas.","III, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],
 c:4, d:"Portaria 163/2001, art. 8º, caput e parágrafo único, e Anexo II (modalidade 99)", k:"Natureza da despesa de ambas",
 x:"I: correta (art. 8º, parágrafo único). II: correta (art. 8º, caput: 99.999.9999 para a Reserva de Contingência e 99.997.9999 para a Reserva do RPPS). III: correta (Anexo II, modalidade 99: uso exclusivo do Legislativo ou para classificar as Reservas, vedada a execução). Gabarito: I, II e III."},

{t:"Portaria STN 710/2021", e:"Nos termos da Portaria Conjunta STN/SOF nº 20/2021 e da Portaria STN nº 710/2021, considere:<br>I. Denomina-se fonte ou destinação de recursos o agrupamento de despesas que possuem o mesmo objeto de gasto.<br>II. O ente pode criar detalhamentos adicionais aos códigos padronizados de fontes, sem necessidade de envio desses detalhamentos à STN.<br>III. A classificação por fontes ou destinações de recursos é de observância obrigatória a partir do exercício de 2025, sendo facultativa até então.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","III, apenas.","I e II, apenas.","II e III, apenas."],
 c:1, d:"Portaria Conjunta STN/SOF 20/2021, arts. 1º, § 1º, 2º, § 3º, e 3º", k:"Criar fonte nova",
 x:"I: errada, porque fonte é o agrupamento de receitas que possuem as mesmas normas de aplicação na despesa (PC 20/2021, art. 1º, § 1º); objeto de gasto remete ao elemento de despesa. II: correta (PC 20/2021, art. 2º, § 3º); criar fonte nova, porém, é competência exclusiva da STN. III: errada, porque a obrigatoriedade vale a partir do exercício de 2023. Gabarito: II."},

{t:"Portaria STN 710/2021", e:"Na Matriz de Saldos Contábeis de um Município, determinado saldo de disponibilidade está associado à informação complementar de fonte de recursos \"2.540\". Com base na Portaria STN nº 710/2021, considere:<br>I. O primeiro dígito \"2\" identifica Recursos de Exercícios Anteriores.<br>II. O código 540 corresponde a Transferências do FUNDEB (Impostos e Transferências de Impostos).<br>III. O primeiro dígito integra a codificação padronizada da classificação por fonte de recursos, que passa a ter 4 dígitos para toda a Federação.<br>Está correto o que se afirma em",
 a:["III, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:1, d:"Portaria STN 710/2021, Anexo I (fonte 540) e Anexo II, art. 2º, § 1º, e Quadro 1", k:"Recursos de Exercícios Anteriores",
 x:"I: correta (Anexo II, Quadro 1: 1 = exercício corrente, 2 = exercícios anteriores, 9 = recursos condicionados). II: correta (Anexo I, fonte 540). III: errada, porque o primeiro dígito identifica o exercício do recurso e não compõe a codificação padronizada, que tem 3 dígitos (Anexo II, art. 2º, § 1º). Gabarito: I e II."},

{t:"Portaria STN 710/2021", e:"Um Estado promoveu a segregação da massa de segurados de seu RPPS. De acordo com o Anexo I da Portaria STN nº 710/2021, considere:<br>I. A fonte 800 destina-se ao controle dos recursos vinculados ao Fundo em Repartição (Plano Financeiro).<br>II. A fonte 801 deve existir somente nos entes que segregaram a massa dos segurados.<br>III. A fonte 802 controla os recursos destinados ao custeio das despesas necessárias à organização e ao funcionamento da unidade gestora do RPPS (Taxa de Administração).<br>Está correto o que se afirma em",
 a:["II, apenas.","III, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:3, d:"Portaria STN 710/2021, Anexo I (fontes 800, 801 e 802)", k:"Fundo em Repartição (Plano Financeiro)",
 x:"I: errada, porque a 800 é do Fundo em Capitalização (Plano Previdenciário), que existe tanto nos entes que segregaram quanto nos que não segregaram a massa; o Fundo em Repartição (Plano Financeiro) é a 801. II: correta (Anexo I, fonte 801). III: correta (Anexo I, fonte 802). Gabarito: II e III."},

{t:"Portaria STN 710/2021", e:"Quanto ao Código de Acompanhamento da Execução Orçamentária (CO), previsto no Anexo II da Portaria STN nº 710/2021, considere:<br>I. O CO possui 4 dígitos, no intervalo de numeração de 1000 a 6999.<br>II. Os códigos do CO destinam-se exclusivamente à fase de execução da receita orçamentária.<br>III. O CO corresponde ao dígito incluído antes da codificação da fonte de recursos para distinguir os recursos arrecadados no exercício corrente dos arrecadados em exercícios anteriores.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","III, apenas.","I e III, apenas.","I, II e III."],
 c:0, d:"Portaria STN 710/2021, Anexo II, arts. 2º e 4º", k:"4 dígitos, 1000 a 6999",
 x:"I: correta (Anexo II, art. 4º). II: errada, porque o art. 4º divide o CO em códigos para a execução da despesa, para as fases de execução da receita e da despesa e para a execução da receita. III: errada, porque essa é a função do dígito de identificação do exercício (art. 2º e Quadro 1: 1, 2 ou 9), que não se confunde com o CO. Gabarito: I."},

{t:"Siconfi", e:"Considerando a Lei Complementar nº 101/2000, com a redação dada pela LC nº 178/2021, e a Portaria STN nº 642/2019, considere:<br>I. Os Estados e os Municípios encaminharão suas contas ao Poder Executivo da União até 30 de abril.<br>II. O Poder Executivo da União promoverá, até o dia 30 de junho, a consolidação, nacional e por esfera de governo, das contas dos entes da Federação relativas ao exercício anterior.<br>III. A MSC agregada deve ser enviada ao Siconfi até 30 dias após o encerramento de cada bimestre.<br>Está correto o que se afirma em",
 a:["I, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:1, d:"LRF, art. 51, caput e § 1º; Portaria STN 642/2019, art. 8º, § 2º", k:"o antigo 31/05 dos Estados",
 x:"I: correta (LRF, art. 51, § 1º, após a LC 178/2021; o antigo prazo de 31 de maio dos Estados não vale mais). II: correta (LRF, art. 51, caput). III: errada, porque a MSC agregada é mensal, com envio até o último dia do mês seguinte ao de referência (Portaria 642, art. 8º, § 2º); 30 dias após o bimestre é o prazo do RREO. Gabarito: I e II."},

{t:"Siconfi", e:"A respeito da Matriz de Saldos Contábeis (MSC), disciplinada pela Portaria STN nº 642/2019, considere:<br>I. A MSC é enviada exclusivamente pelo Poder Executivo do ente, utilizando as contas de último nível do PCASP Estendido detalhadas por informações complementares.<br>II. A MSC contém dados consolidados, com a exclusão prévia dos saldos recíprocos entre os órgãos e entidades do ente.<br>III. A MSC agregada é considerada entregue somente após a sua homologação.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","III, apenas.","I e II, apenas.","II e III, apenas."],
 c:0, d:"Portaria STN 642/2019, arts. 3º, §§ 1º e 4º, 7º e 8º", k:"se excluem os saldos recíprocos",
 x:"I: correta (art. 8º: envio pelo Poder Executivo, com as contas de último nível do PCASP Estendido). II: errada, porque os dados da MSC são agregados e não consolidados (art. 8º); a exclusão dos saldos recíprocos ocorre depois, na consolidação. III: errada, porque a MSC é considerada entregue na inserção no Siconfi (art. 3º, § 4º); a homologação é o marco da DCA, do RREO e do RGF (art. 3º, § 1º). Gabarito: I."},

{t:"Siconfi", e:"Segundo a Portaria STN nº 642/2019, a respeito dos demonstrativos gerados automaticamente pelo Siconfi a partir das MSCs, considere:<br>I. Os rascunhos gerados têm caráter auxiliar e indicativo, sendo de responsabilidade exclusiva do ente conferir, editar e homologar as declarações.<br>II. Não são gerados automaticamente os Anexos 8 (MDE), 10 (Projeção Atuarial) e 12 (Saúde) do RREO.<br>III. Editado o rascunho pelo ente, fica dispensada a explicação do motivo da alteração em nota explicativa.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas."],
 c:2, d:"Portaria STN 642/2019, arts. 9º e 10", k:"auxiliar e indicativo",
 x:"I: correta (art. 9º, § 1º). II: correta (art. 9º, I a III); o Anexo 8 segue para o SIOPE, o 12 para o SIOPS e o 10 depende da avaliação atuarial. III: errada, porque, se editar o rascunho, o ente deve explicar o motivo da alteração em nota explicativa (art. 9º, § 2º). Gabarito: I e II."},

{t:"Siconfi", e:"Sobre as validações aplicadas no carregamento da MSC no Siconfi (Portaria STN nº 642/2019), considere:<br>I. A igualdade entre o total de débitos e o total de créditos dentro do grupo das classes 5 e 6 constitui validação impeditiva.<br>II. O saldo de natureza invertida em conta de ativo constitui validação impeditiva, que impede a finalização da MSC.<br>III. A conferência de que o saldo inicial, somado ou subtraído da movimentação do período, resulta no saldo final constitui validação impeditiva.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","III, apenas.","I e III, apenas.","I, II e III."],
 c:3, d:"Portaria STN 642/2019, art. 15", k:"Detectam inconsistências relevantes que",
 x:"I: correta; a carga da MSC exige débitos iguais a créditos em cada grupo de classes (1 a 4, 5 e 6, 7 e 8). II: errada, porque saldo invertido é verificação de qualidade (Ranking), que não impede a finalização da declaração. III: correta (saldo inicial ± movimentação = saldo final). Gabarito: I e III."},

{t:"Siconfi", e:"No Ranking da Qualidade da Informação Contábil e Fiscal no Siconfi, considere:<br>I. A verificação que confronta a receita do Anexo I-C da DCA com a do Anexo 1 do RREO do 6º bimestre pertence à dimensão IV (Informações Contábeis versus Fiscais).<br>II. A verificação da igualdade da RCL entre o Anexo 3 do RREO e os anexos do RGF pertence à dimensão III (Informações Fiscais).<br>III. O número de retificações das declarações é avaliado na dimensão I (Gestão da Informação).<br>Está correto o que se afirma em",
 a:["II, apenas.","III, apenas.","I e II, apenas.","I e III, apenas.","I, II e III."],
 c:4, d:"Portaria STN/MF 807/2023 (Ranking do Siconfi)", k:"DCA/MSC confrontadas com RREO/RGF",
 x:"I: correta (a dimensão IV cruza DCA e MSC com RREO e RGF). II: correta (a dimensão III trata da consistência do RREO e do RGF, inclusive entre si, e da aderência ao MDF). III: correta (a dimensão I avalia envio, tempestividade e número de retificações). Gabarito: I, II e III."},

{t:"Siconfi", e:"Quanto à assinatura, homologação e retificação das declarações no Siconfi (Portaria STN nº 642/2019), considere:<br>I. A DCA deve ser assinada pelo Chefe do Poder Executivo e pelo profissional de contabilidade responsável, mediante certificado digital e-CPF, modelo A3, padrão ICP-Brasil.<br>II. A MSC enviada pode ser excluída pelo ente a qualquer tempo, independentemente de reenvio.<br>III. O status \"Retificado\" equivale ao de homologado para fins de comprovação da entrega.<br>Está correto o que se afirma em",
 a:["II, apenas.","III, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:2, d:"Portaria STN 642/2019, art. 12, § 1º, I, e § 2º; regras de retificação do Siconfi", k:"e-CPF, modelo A3, padrão ICP-Brasil",
 x:"I: correta (art. 12; o controle interno pode assinar, mas é opcional). II: errada, porque a MSC não pode ser excluída, apenas reenviada. III: correta; na retificação cancelam-se as assinaturas, corrige-se e assina-se e homologa-se de novo, e o status \"Retificado\" comprova a entrega. Gabarito: I e III."},

{t:"Siconfi", e:"Nos termos da Lei Complementar nº 101/2000, com a redação dada pela LC nº 178/2021, considere:<br>I. O descumprimento dos prazos de encaminhamento das contas impedirá, até que a situação seja regularizada, que o Poder ou órgão referido no art. 20 receba transferências voluntárias e contrate operações de crédito, exceto as destinadas ao pagamento da dívida mobiliária.<br>II. O descumprimento do prazo de publicação do Relatório de Gestão Fiscal sujeita o ente à mesma sanção prevista para o atraso no encaminhamento das contas.<br>III. O descumprimento dos prazos de encaminhamento das contas impede o recebimento das transferências constitucionais, como as cotas do FPE e do FPM.<br>Está correto o que se afirma em",
 a:["II, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:1, d:"LRF, art. 51, § 2º, e art. 55, §§ 2º e 3º", k:"exceto as destinadas ao pagamento da dívida mobiliária",
 x:"I: correta, literal do art. 51, § 2º. II: correta (art. 55, § 3º, remete à sanção do § 2º do art. 51). III: errada, porque a sanção alcança transferências voluntárias e operações de crédito, e não as transferências constitucionais. Gabarito: I e II."},

{t:"RPPS", e:"Acerca das provisões matemáticas previdenciárias dos RPPS, considere:<br>I. A provisão matemática de benefícios concedidos refere-se aos servidores ativos que já cumpriram os requisitos de aposentadoria.<br>II. As provisões matemáticas previdenciárias são registradas no patrimônio líquido do RPPS, como reservas atuariais.<br>III. As provisões matemáticas previdenciárias correspondem à diferença entre o valor atual dos benefícios futuros e o valor atual das contribuições futuras.<br>Está correto o que se afirma em",
 a:["III, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:0, d:"IPC 14 (PMP = VABF - VACF); Portaria MTP 1.467/2022, art. 50", k:"valor atual dos benefícios futuros menos",
 x:"I: errada, porque a PMBC se refere aos aposentados e pensionistas já em gozo de benefício; os servidores ativos estão na provisão de benefícios a conceder (PMBaC). II: errada, porque as provisões são o passivo atuarial (Portaria 1.467, art. 50), no passivo não circulante (2.2.7.2); no PL ficam as reservas atuariais. III: correta (IPC 14: PMP = VABF menos VACF). Gabarito: III."},

{t:"RPPS", e:"Um RPPS em regime de capitalização apresentou, na avaliação atuarial de 31/12: provisão matemática de benefícios concedidos de R$ 400 milhões; provisão matemática de benefícios a conceder de R$ 500 milhões (ambas já líquidas das contribuições futuras); aplicações financeiras de R$ 620 milhões, das quais R$ 20 milhões correspondem a recursos da taxa de administração; e créditos de parcelamento de débitos do ente, reconhecidos pelo RPPS e contabilizados pelo ente como dívida fundada, com termo cadastrado no Cadprev, de R$ 50 milhões. Com base na Portaria MTP nº 1.467/2022, considere:<br>I. O passivo atuarial é de R$ 900 milhões.<br>II. Os ativos garantidores somam R$ 650 milhões, pois os recursos da taxa de administração são excluídos e os créditos do parcelamento podem ser considerados.<br>III. O resultado atuarial é um déficit de R$ 250 milhões.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:4, d:"Portaria MTP 1.467/2022, arts. 50, caput e § 1º, e 51, II; Anexo VI, art. 2º, IV", k:"O resultado atuarial será obtido",
 x:"I: correta; passivo atuarial = provisões matemáticas = 400 + 500 = 900 (art. 50). II: correta; 620 - 20 (taxa de administração, excluída pelo Anexo VI, art. 2º, IV) + 50 (parcelamento, art. 51, II) = 650. III: correta; o resultado é a diferença entre passivo atuarial e ativos garantidores (art. 50, § 1º): 900 - 650 = déficit de 250. Gabarito: I, II e III."},

{t:"RPPS", e:"O Tesouro estadual repassou recursos ao RPPS para cobertura de insuficiência financeira do Fundo em Repartição. Segundo o MCASP e a Lei nº 9.717/1998, considere:<br>I. Os entes da Federação são responsáveis pela cobertura de eventuais insuficiências financeiras do respectivo regime próprio, decorrentes do pagamento de benefícios previdenciários.<br>II. O repasse deve ser executado no ente como despesa orçamentária intraorçamentária, na natureza 3.3.91.97.<br>III. Não há execução orçamentária pela transferência, pois o RPPS já contabilizou a despesa do benefício; ocorre apenas uma descentralização financeira.<br>Está correto o que se afirma em",
 a:["III, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:2, d:"Lei 9.717/1998, art. 2º, § 1º; MCASP 11ª ed., Parte III (RPPS)", k:"não há execução orçamentária",
 x:"I: correta (Lei 9.717, art. 2º, § 1º). II: errada, porque 3.3.91.97 é o aporte para cobertura do déficit atuarial; a cobertura de insuficiência é transferência financeira, com VPD 3.5.1.3.2 no ente e VPA 4.5.1.3.2 no RPPS. III: correta (MCASP: se o ente também registrasse o gasto, haveria duplicidade de registros orçamentários). Gabarito: I e III."},

{t:"RPPS", e:"Conforme a Portaria MTP nº 1.467/2022, a respeito dos aportes destinados ao equacionamento do déficit atuarial do RPPS, considere:<br>I. Os recursos deles decorrentes podem ser utilizados para o pagamento de benefícios de qualquer dos fundos, desde que haja insuficiência financeira no mês.<br>II. Devem ser aplicados, conforme as regras do CMN, por, no mínimo, 5 anos a contar da data do respectivo repasse à unidade gestora.<br>III. O plano de equacionamento do déficit considera-se implementado com a aprovação do conselho deliberativo do RPPS, dispensada a previsão em lei do ente.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","III, apenas.","I e III, apenas.","II e III, apenas."],
 c:1, d:"Portaria MTP 1.467/2022, art. 55, §§ 5º, 6º e 8º", k:"no mínimo, 5 anos",
 x:"I: errada, porque só podem pagar benefícios dos segurados vinculados ao Fundo em Capitalização, com gestão segregada (art. 55, § 8º, I e II). II: correta (art. 55, § 8º, III). III: errada, porque o plano só é considerado implementado a partir do seu estabelecimento em lei do ente (art. 55, § 6º); o conselho deliberativo apenas aprecia a proposta (§ 5º). Gabarito: II."},

{t:"RPPS", e:"Para equacionar o déficit atuarial de seu RPPS, o Estado instituiu, por lei, alíquota de contribuição suplementar e, adicionalmente, aportes mensais com valores preestabelecidos. De acordo com a Portaria Interministerial STN/SOF nº 163/2001, considere:<br>I. A alíquota de contribuição suplementar integra o elemento 13, Obrigações Patronais, sendo classificada no ente em 3.1.91.13.<br>II. Os aportes periódicos são classificados no ente em 3.3.91.97.<br>III. O elemento 97 exclui expressamente as despesas decorrentes de alíquota de contribuição suplementar.<br>Está correto o que se afirma em",
 a:["I, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:4, d:"Portaria 163/2001, Anexo II (elementos 13 e 97; modalidade 91)", k:"Aporte periódico para déficit atuarial",
 x:"I: correta; o elemento 13 inclui a alíquota de contribuição suplementar para cobertura do déficit atuarial, no grupo Pessoal e Encargos Sociais, com modalidade 91 por ser operação intraorçamentária. II: correta (Outras Despesas Correntes, modalidade 91, elemento 97). III: correta; o elemento 97 abrange os aportes \"exceto as decorrentes de alíquota de contribuição suplementar\". Gabarito: I, II e III."},

{t:"RPPS", e:"Em relação à segregação da massa de segurados do RPPS, considere:<br>I. O Fundo em Capitalização será constituído por um grupo fechado em extinção, sendo vedado o ingresso de novos segurados.<br>II. Fica vedada a transferência de beneficiários, recursos ou obrigações entre os fundos, ressalvada a revisão da segregação admitida na norma.<br>III. A implementação de segregação da massa de segurados não será considerada como ausência de déficit para fins de fixação das alíquotas de contribuição.<br>Está correto o que se afirma em",
 a:["II, apenas.","III, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas."],
 c:4, d:"Portaria MTP 1.467/2022, arts. 58, II, e 60, IV; EC 103/2019, art. 9º, § 5º", k:"fechado em extinção",
 x:"I: errada, porque o grupo fechado em extinção é o Fundo em Repartição; os novos segurados são alocados no Fundo em Capitalização (Portaria 1.467, art. 58, II). II: correta (art. 60, IV, ressalvada a revisão do art. 62). III: correta (EC 103/2019, art. 9º, § 5º). Gabarito: II e III."},

{t:"RPPS", e:"Na hipótese de o RPPS apresentar superávit atuarial, considere:<br>I. Segundo o MCASP, não há possibilidade legal de devolução desses valores ao ente, embora seja possível a reformulação do plano de custeio.<br>II. A redução do plano de custeio exige, entre outros requisitos, que as receitas do RPPS sejam superiores às despesas nos 10 exercícios subsequentes ao da avaliação.<br>III. O superávit deve ser destinado, obrigatoriamente, a reserva de contingência de até 25% das provisões matemáticas, e o excedente a reserva especial.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","III, apenas.","I e III, apenas.","II e III, apenas."],
 c:0, d:"MCASP 11ª ed. (superávit atuarial); Portaria MTP 1.467/2022, art. 65", k:"Não pode ser devolvido ao ente",
 x:"I: correta (MCASP). II: errada, porque o art. 65, II, da Portaria 1.467 exige receitas superiores às despesas nos 5 exercícios subsequentes, além de ativos garantidores superiores à PMBC e apreciação do conselho deliberativo. III: errada, porque essa é regra das entidades fechadas de previdência complementar (LC 109/2001), que não existe para o RPPS. Gabarito: I."},

{t:"RPPS", e:"O Estado X reorganizou seu RPPS: os servidores que ingressaram até 31/12/2023 foram alocados em fundo em regime de repartição simples, e os que ingressaram a partir de 01/01/2024 passaram a integrar fundo em regime de capitalização. Nessa situação, considere:<br>I. O déficit atuarial do fundo em repartição deve ser equacionado por aportes periódicos classificados no elemento de despesa 97.<br>II. O ente é responsável pela cobertura de eventuais insuficiências financeiras do fundo em repartição, decorrentes do pagamento de benefícios previdenciários.<br>III. Os recursos do fundo em repartição são identificados na fonte 801, e os do fundo em capitalização, na fonte 800.<br>Está correto o que se afirma em",
 a:["II, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:3, d:"Lei 9.717/1998, art. 2º, § 1º; Portaria STN 710/2021, Anexo I; Portaria MTP 1.467/2022, art. 55, § 8º", k:"SC Seguro = Fundo em Repartição (fonte 801)",
 x:"I: errada, porque o déficit atuarial só se apura no Fundo em Capitalização; no Fundo em Repartição a falta de recursos é insuficiência financeira, e os aportes do art. 55, § 8º, só pagam benefícios do Fundo em Capitalização. II: correta (Lei 9.717, art. 2º, § 1º). III: correta (Portaria 710, Anexo I). É o modelo do IPREV/SC após a LC 848/2023. Gabarito: II e III."},

{t:"RPPS", e:"Segundo a Portaria MTP nº 1.467/2022 e a Lei nº 9.717/1998, a respeito dos ativos garantidores dos compromissos do plano de benefícios do RPPS, considere:<br>I. Compõem os ativos garantidores os recursos relativos ao financiamento das despesas administrativas do regime (taxa de administração).<br>II. Podem ser considerados os créditos a receber do ente reconhecidos nas demonstrações contábeis do RPPS, desde que o ente os contabilize como dívida fundada com a unidade gestora e o termo de parcelamento esteja cadastrado no Cadprev.<br>III. É vedada a aplicação de recursos em títulos públicos, com exceção de títulos do Governo Federal.<br>Está correto o que se afirma em",
 a:["I, apenas.","III, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],
 c:3, d:"Portaria MTP 1.467/2022, art. 51, II, e Anexo VI, art. 2º, IV; Lei 9.717/1998, art. 6º, VI", k:"fundos para oscilação de riscos",
 x:"I: errada, porque o Anexo VI, art. 2º, IV, exclui dos ativos garantidores os recursos das despesas administrativas, os fundos para oscilação de riscos e as provisões em repartição de capitais de cobertura. II: correta (art. 51, II, a e b). III: correta (Lei 9.717, art. 6º, VI). Gabarito: II e III."},

{t:"RPPS / RREO", e:"Sobre os demonstrativos do RREO relacionados ao RPPS, considere:<br>I. O demonstrativo das projeções atuariais do regime próprio acompanha o RREO de todos os bimestres.<br>II. Segundo o MDF, o Demonstrativo da Projeção Atuarial do RPPS deve apresentar a projeção de pelo menos 35 anos.<br>III. O Demonstrativo da Projeção Atuarial (Anexo 10) não é gerado automaticamente pelo Siconfi a partir das MSCs.<br>Está correto o que se afirma em",
 a:["I, apenas.","II, apenas.","III, apenas.","I e II, apenas.","I, II e III."],
 c:2, d:"LRF, art. 53, § 1º, II; MDF (Anexo 10 do RREO); Portaria STN 642/2019, arts. 9º e 10", k:"com os mesmos dados enviados ao Ministério",
 x:"I: errada, porque o art. 53, § 1º, II, da LRF manda que as projeções atuariais acompanhem apenas o relatório do último bimestre. II: errada, porque o MDF exige projeção de pelo menos 75 anos. III: correta (Portaria 642: os Anexos 8, 10 e 12 do RREO não são pré-preenchidos; o 10 depende da avaliação atuarial). Gabarito: III."}
];
const PAGINAS={"possibilitar a eliminação da dupla contagem":4,"A LOA vai, no mínimo, até a":5,"Aporte para Cobertura do Déficit Atuarial do RPPS":7,"Multas e juros sobre receitas de capital":4,"Natureza da despesa de ambas":5,"Criar fonte nova":8,"Recursos de Exercícios Anteriores":8,"Fundo em Repartição (Plano Financeiro)":9,"4 dígitos, 1000 a 6999":8,"o antigo 31/05 dos Estados":11,"se excluem os saldos recíprocos":12,"auxiliar e indicativo":13,"Detectam inconsistências relevantes que":13,"DCA/MSC confrontadas com RREO/RGF":14,"e-CPF, modelo A3, padrão ICP-Brasil":13,"exceto as destinadas ao pagamento da dívida mobiliária":14,"valor atual dos benefícios futuros menos":15,"O resultado atuarial será obtido":16,"não há execução orçamentária":18,"no mínimo, 5 anos":18,"Aporte periódico para déficit atuarial":18,"fechado em extinção":19,"Não pode ser devolvido ao ente":17,"SC Seguro = Fundo em Repartição (fonte 801)":19,"fundos para oscilação de riscos":15,"com os mesmos dados enviados ao Ministério":19};

const L = "ABCDE";
// letra final desejada da correta (FCC distribui o gabarito); null = manter ordem original
const ALVO = [];
const Q = QUESTOES.map((q,i)=>{
  const alvo = ALVO[i]; let rot = 0;
  if (alvo) rot = (L.indexOf(alvo) - q.c + 5) % 5;
  const alts = new Array(5); const mapa = {};
  q.a.forEach((t,j)=>{ const n=(j+rot)%5; alts[n]=t; mapa[L[j]]=L[n]; });
  const x = q.x.replace(/\(([A-E])\)/g,(m,l)=>"("+mapa[l]+")");
  return {...q, alts, correta:(q.c+rot)%5, x};
});
const estado = {}, chutes = {}; let filtro = "Todas";
function salvar(){ try{ localStorage.setItem("qfcc-casp-v2", JSON.stringify(estado)); localStorage.setItem("qfcc-casp-v2-chute", JSON.stringify(chutes)); }catch(e){} }
try{ Object.assign(estado, JSON.parse(localStorage.getItem("qfcc-casp-v2")||"{}")); Object.assign(chutes, JSON.parse(localStorage.getItem("qfcc-casp-v2-chute")||"{}")); }catch(e){}
const temas = ["Todas", ...new Set(Q.map(q=>q.t)), "Não respondidas", "Erradas", "Chutadas"];
function renderFiltros(){
  document.getElementById("filtros").innerHTML = temas.map(t=>`<button class="chip ${t===filtro?"on":""}" data-f="${t}">${t}</button>`).join(" ");
}
function render(){
  const el = document.getElementById("lista"); el.innerHTML = "";
  Q.forEach((q,i)=>{
    if (filtro==="Chutadas" ? !chutes[i] : filtro==="Não respondidas" ? estado[i]!==undefined : filtro==="Erradas" ? !(estado[i]!==undefined && estado[i]!==-1 && estado[i]!==q.correta) : (filtro!=="Todas" && q.t!==filtro)) return;
    const esc = estado[i]; const resp = esc!==undefined;
    const pag = (typeof PAGINAS!=="undefined" && PAGINAS[q.k]) ? PAGINAS[q.k] : null;
    const d = document.createElement("div"); d.className="q";
    d.innerHTML = `<div class="qh"><span class="num">Q ${String(i+1).padStart(2,"0")}</span><span class="tag">${q.t}</span><span class="tag">FCC · inédita</span>${chutes[i]&&resp?`<span class="tag ch">no chute</span>`:""}</div>
      <p class="en">${q.e}</p>
      <label class="chute"><input type="checkbox" data-chute="${i}" ${chutes[i]?"checked":""} ${resp?"disabled":""}> Vou responder no chute</label>
      ${q.alts.map((t,j)=>{ let c=""; if(resp){ if(j===q.correta)c="certa"; else if(j===esc)c="errada"; }
        return `<button class="alt ${c}" data-q="${i}" data-a="${j}" ${resp?"disabled":""}><b>(${L[j]})</b><span>${t}</span></button>`; }).join("")}
      <div class="res ${resp?"show":""}">
        ${esc===-1?`<div class="veredito">Gabarito: ${L[q.correta]}</div>`:`<div class="veredito ${esc===q.correta?"ok":"no"}">${esc===q.correta?"Acertou":"Errou"}. Gabarito: ${L[q.correta]}</div>`}
        <div>${q.x}</div>
        <div class="rev">${q.d?`<b>${q.d}</b>. `:""}<a href="casp-portarias-siconfi-rpps-resumo.html#:~:text=${encodeURIComponent(q.k)}" target="_blank" rel="noopener">Abrir no resumo</a>${pag?` (página ${pag} no Word)`:""}. Ctrl+F: <code>${q.k}</code></div>
      </div>`;
    el.appendChild(d);
  });
  const feitas = Object.keys(estado).filter(k=>estado[k]!==-1);
  const certas = feitas.filter(k=>estado[k]===Q[k].correta).length;
  const ch = feitas.filter(k=>chutes[k]); const chC = ch.filter(k=>estado[k]===Q[k].correta).length;
  document.getElementById("score").textContent = `${feitas.length} de ${Q.length} respondidas · ${certas} acertos` + (feitas.length?` (${Math.round(100*certas/feitas.length)}%)`:"") + (ch.length?` · ${ch.length} no chute (${chC} acertos)`:"");
}
document.addEventListener("click",e=>{
  const cb = e.target.closest("[data-chute]"); if (cb){ const i=+cb.dataset.chute; if(cb.checked) chutes[i]=1; else delete chutes[i]; salvar(); return; }
  const a = e.target.closest(".alt"); if (a && !a.disabled){ estado[+a.dataset.q] = +a.dataset.a; salvar(); render(); return; }
  const f = e.target.closest("[data-f]"); if (f){ filtro=f.dataset.f; renderFiltros(); render(); }
});
document.getElementById("mostrar").onclick=()=>{ Q.forEach((q,i)=>{ if(estado[i]===undefined) estado[i]=-1; }); salvar(); render(); };
document.getElementById("refazer").onclick=()=>{ for(const k in estado) delete estado[k]; for(const k in chutes) delete chutes[k]; salvar(); render(); window.scrollTo(0,0); };
document.getElementById("themeBtn").onclick=()=>{ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark?"light":"dark"; };
renderFiltros(); render();
</script>
