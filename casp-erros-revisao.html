<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão da Vanessa: Contabilidade Pública, meus erros</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(160deg,#e6f5f2,#c9e9e4); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:70px 16px 24px; color:#1E2B38;}
  .box{width:100%; max-width:560px; text-align:center;}
  h1{font-size:1.3rem; color:#0f766e; margin-bottom:4px;}
  .sub{color:#64748b; font-size:.9rem; margin-bottom:16px;}
  .contador{font-weight:700; color:#64748b; margin-bottom:10px;}
  .tema{display:inline-block; font-size:.78rem; font-weight:700; color:#0f766e; background:#fff; border:1px solid #0f766e; border-radius:999px; padding:2px 10px; margin-bottom:10px;}
  .tema.facil{color:#fff; background:#2e7d4f; border-color:#2e7d4f;}
  .cartao{background:#fff; border-radius:22px; box-shadow:0 12px 34px rgba(30,43,56,.16); padding:30px 24px; min-height:260px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;}
  .rotulo{font-size:.75rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:800;}
  .rotulo.p{color:#E25E42;} .rotulo.r{color:#0f766e;}
  .pergunta{font-size:1.25rem; font-weight:800; line-height:1.4;}
  .resposta{font-size:1.08rem; line-height:1.55; color:#1E2B38; border-top:2px dashed #e2e8f0; padding-top:14px; width:100%;}
  .fonte{display:block; margin-top:8px; font-size:.82rem; color:#64748b;}
  .bts{display:flex; gap:10px; margin-top:16px; justify-content:center; flex-wrap:wrap;}
  button{font-family:inherit; font-size:1rem; font-weight:800; border:none; cursor:pointer; padding:13px 20px; border-radius:14px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .prox{background:#E25E42; color:#fff;} .ant{background:#e2e8f0; color:#1E2B38;} .emb{background:#fff; color:#1E2B38; border:2px solid #cbd5e1;}
</style>
</head>
<body>
<a href="index.html" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">&larr; Voltar</a>
<div class="box">
  <h1>Contabilidade Pública: meus erros em cartões</h1>
  <div class="sub">Tudo aqui eu já errei em questão FCC. Leia a pergunta, responda de cabeça, confira logo abaixo.</div>
  <div class="contador" id="contador"></div>
  <div class="tema" id="tema"></div>
  <div class="cartao">
    <div><div class="rotulo p">Pergunta</div><div class="pergunta" id="pergunta"></div></div>
    <div class="resposta" id="resposta"></div>
  </div>
  <div class="bts">
    <button class="ant" id="ant">&larr; Anterior</button>
    <button class="prox" id="prox">Próximo &rarr;</button>
  </div>
  <div class="bts"><button class="emb" id="emb">Embaralhar e recomeçar</button></div>
</div>
<script>
const cartoes = [
["Bem fácil","O empenho gera lançamento patrimonial?","Não. Empenho é só orçamentário (classes 6 e 8).<br>Não gera variação, nem passivo.","Errei 3 vezes marcando o empenho como fato patrimonial"],
["Bem fácil","A entrega do material comprado é variação qualitativa ou quantitativa?","Qualitativa.<br>Entra estoque e nasce o passivo com o fornecedor: só troca.","MCASP"],
["Bem fácil","O pagamento de uma despesa já liquidada é qualitativa ou quantitativa?","Qualitativa.<br>Sai caixa e some o passivo.","MCASP"],
["Bem fácil","O consumo do material em estoque é que variação?","Quantitativa: VPD.<br>É aqui que a despesa patrimonial aparece.","MCASP"],
["Bem fácil","Receber uma caução em dinheiro é que variação?","Qualitativa.<br>Entra caixa e nasce a obrigação de devolver.<br>É ingresso extraorçamentário.","MCASP"],
["Bem fácil","Doação de um bem móvel recebida gera receita orçamentária?","Não. Gera só VPA.<br>Doação em dinheiro, sim: é receita orçamentária (art. 57 da Lei 4.320).","MCASP"],
["Bem fácil","O que é cada classe do PCASP?","1 ativo · 2 passivo e PL · 3 VPD · 4 VPA<br>5 aprovação do orçamento · 6 execução do orçamento<br>7 controles devedores · 8 controles credores","PCASP"],
["Bem fácil","“Crédito disponível” é ativo?","Não. É dotação orçamentária ainda não empenhada.<br>Classe 6, natureza orçamentária.","PCASP"],
["Variações","O que é fato independente da execução orçamentária?","O que é só patrimonial: distribuir estoque já comprado, depreciação, reversão de provisão.<br>Se passa por receita ou despesa orçamentária, é dependente.","MCASP"],
["Variações","Na ordem da despesa, onde está a VPD?","Empenho: nada.<br>Entrega: qualitativa.<br>Liquidação: nada patrimonial.<br>Pagamento: qualitativa.<br>Consumo: VPD.","MCASP"],
["Variações","Serviço prestado em 2023, sem registro, pago como DEA em 2024: que variação?","Quantitativa, em 2024, contra superávit ou déficit acumulado (ajuste de exercícios anteriores).","MCASP"],
["NBC TSP","O que é receita na NBC TSP?","Aumento da situação patrimonial líquida que não vem de contribuição dos proprietários.<br>Não é entrada de caixa.","NBC TSP Estrutura Conceitual"],
["PCASP","Inscrição de restos a pagar x execução de restos a pagar?","Inscrição: classe 5.<br>Execução: classe 6.","PCASP"],
["PCASP","O lançamento de receita tributária vai em que classes?","É patrimonial: D créditos a receber (1) / C VPA (4).<br>A arrecadação é que vai na classe 6.","PCASP"],
["NBC TSP","Quais são os seis elementos?","Ativo, passivo, receita, despesa, contribuição dos proprietários, distribuição aos proprietários.<br>A situação patrimonial líquida NÃO é elemento.","NBC TSP Estrutura Conceitual"],
["Mensuração","Quais bases são só de ativo e quais são só de passivo?","Só ativo: custo de reposição, valor em uso, preço líquido de venda.<br>Só passivo: custo de liberação, custo de cumprimento, preço presumido.<br>Dos dois: custo histórico e valor de mercado.","NBC TSP Estrutura Conceitual"],
["Mensuração","O custo de reposição ajuda a avaliar a capacidade financeira?","Não. Quem faz isso é o valor de mercado.<br>Custo de reposição: valor de entrada, específico da entidade, mede os recursos para prestar serviços.","Acertei e depois errei esse tema"],
["Mensuração","O custo histórico é ajustado quando os preços mudam?","Não.<br>Ele pode virar despesa por depreciação ou amortização.","NBC TSP Estrutura Conceitual, item 7.14"],
["Usuários","Quem são os usuários primários dos RCPGs?","Usuários dos serviços e seus representantes.<br>Provedores de recursos e seus representantes.","NBC TSP Estrutura Conceitual"],
["Características","Quais as características qualitativas da NBC TSP?","Seis, sem hierarquia: relevância, representação fidedigna, compreensibilidade, tempestividade, comparabilidade, verificabilidade.<br>Fundamental e de melhoria é do CPC 00.","NBC TSP Estrutura Conceitual"],
["Características","Custo-benefício é característica qualitativa?","Não. É restrição.<br>Restrições: materialidade, custo-benefício e equilíbrio entre as características.","NBC TSP Estrutura Conceitual"],
["Estoques","Como se mede o estoque para distribuição gratuita?","Pelo menor entre o custo e o custo corrente de reposição.<br>Estoque para venda: menor entre custo e valor realizável líquido.","NBC TSP 04"],
["Estoques","E o estoque recebido sem contraprestação (doação)?","Pelo valor justo na data da aquisição.","NBC TSP 04"],
["Estoques","O que entra no custo de aquisição do estoque?","Preço, menos descontos comerciais, mais frete.<br>Tributos recuperáveis ficam de fora.","NBC TSP 04"],
["Custos","Para comparar objeto de custo final entre entidades, que método?","Absorção integral.<br>finAL → integrAL. Objeto intermediário: qualquer método.","NBC TSP 34"],
["Custos","Que método para a entidade que está começando a apurar custos?","Custeio direto.<br>Absorção parcial quando for relevante alocar os indiretos.","NBC TSP 34"],
["Custos","ABC é método de custeio?","Não. É técnica para rastrear custos indiretos até o objeto de custo.","NBC TSP 34"],
["Outros","Intangível pago a prazo: e a diferença para o preço à vista?","É VPD de juros.<br>Encargos a apropriar ficam como retificadora do passivo, não como ativo.","MCASP"],
["Receita","Multa e juros de mora sobre uma receita de capital são receita de quê?","Receita corrente, sempre.<br>O acessório não herda a categoria do principal.","MCASP, ementário da receita"]
];
let ordem = cartoes.map((_,i)=>i), pos = 0;
const $ = id => document.getElementById(id);
function mostra(){
  const c = cartoes[ordem[pos]];
  $("contador").textContent = `Cartão ${pos+1} de ${cartoes.length}`;
  $("tema").textContent = c[0];
  $("tema").className = "tema" + (c[0]==="Bem fácil" ? " facil" : "");
  $("pergunta").innerHTML = c[1];
  $("resposta").innerHTML = `<div class="rotulo r">Resposta</div>${c[2]}<span class="fonte">${c[3]}</span>`;
}
$("prox").onclick = () => { pos = (pos+1) % cartoes.length; mostra(); };
$("ant").onclick = () => { pos = (pos-1+cartoes.length) % cartoes.length; mostra(); };
$("emb").onclick = () => { for(let i=ordem.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [ordem[i],ordem[j]]=[ordem[j],ordem[i]];} pos=0; mostra(); };
document.addEventListener("keydown", e => { if(e.key==="ArrowRight") $("prox").click(); else if(e.key==="ArrowLeft") $("ant").click(); });
mostra();
</script>
</body>
</html>
